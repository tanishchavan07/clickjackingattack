<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phishing Lab Control Panel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: #e5e7eb;
    font-family: Consolas, monospace;
}

header {
    padding: 20px 35px;
    border-bottom: 1px solid #333;
    background: #0b0b0b;
}

header h1 {
    margin: 0;
    color: #ff3333;
}

header p {
    color: #888;
}

.container {
    max-width: 900px;
    margin: 50px auto;
    padding: 25px;
}

.card {
    background: #101010;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 0 30px rgba(255,0,0,.12);
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    color: #aaa;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    background: #050505;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    outline: none;
    font-family: Consolas, monospace;
}

input:focus,
textarea:focus {
    border-color: #ff3333;
}

button {
    margin-top: 25px;
    padding: 14px 25px;
    background: #b91c1c;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #dc2626;
}

.console {
    margin-top: 30px;
    background: #020202;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 20px;
    min-height: 180px;
    line-height: 1.8;
}

.red {
    color: #ff4444;
}

.green {
    color: #4ade80;
}

.warning {
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #7f1d1d;
    background: #1f0808;
    color: #fca5a5;
    border-radius: 7px;
}
</style>
</head>

<body>

<header>
    <h1>⚠ PHISHING LAB CONTROL PANEL</h1>
    <p>Ethical Hacking • Security Awareness Simulation</p>
</header>

<div class="container">

<div class="card">

    <h2>Simulated Phishing Campaign</h2>

    <div class="warning">
        ⚠ SIMULATION MODE — No real email will be sent.
        The URL is not transmitted anywhere.
    </div>

    <label>Demo Recipient</label>

    <input
        id="recipient"
        type="email"
        placeholder="student@example.test"
    >

    <label>Simulated Malicious Link</label>

    <input
        id="phishingLink"
        type="url"
        placeholder="http://localhost:5500/fake.html"
    >

    <label>Email Subject</label>

    <input
        id="subject"
        value="Urgent: Account Verification Required"
    >

    <label>Message</label>

    <textarea id="message" rows="7">Your account requires verification.

Please verify your account using the link below.</textarea>

    <button onclick="simulateCampaign()">
        ⚡ SIMULATE SEND
    </button>

    <div class="console" id="console">
        <div class="green">[SYSTEM] Phishing lab ready.</div>
        <div>[SYSTEM] Waiting for simulation...</div>
    </div>

</div>

</div>

<script>

function simulateCampaign() {

    const recipient =
        document.getElementById("recipient").value;

    const link =
        document.getElementById("phishingLink").value;

    const subject =
        document.getElementById("subject").value;

    const output =
        document.getElementById("console");

    if (!recipient || !link) {

        output.innerHTML = `
            <div class="red">
                [ERROR] Recipient and simulated link required.
            </div>
        `;

        return;
    }

    output.innerHTML = `
        <div class="green">[✓] Simulation initialized</div>
        <div>[✓] Recipient: ${escapeHTML(recipient)}</div>
        <div>[✓] Subject: ${escapeHTML(subject)}</div>
        <br>
        <div class="red">
            [!] Simulated phishing URL:
        </div>
        <div>${escapeHTML(link)}</div>
        <br>
        <div class="green">
            [✓] Simulation complete
        </div>
        <div>
            [INFO] Real email sent: NO
        </div>
        <div>
            [INFO] Data transmitted: NONE
        </div>
    `;
}

function escapeHTML(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
